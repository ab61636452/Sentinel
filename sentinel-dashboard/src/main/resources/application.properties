#spring settings
spring.http.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true

#logging settings
logging.level.org.springframework.web=INFO
logging.file=${user.home}/logs/csp/sentinel-dashboard.log
logging.pattern.file= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
#logging.pattern.console= %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

#auth settings
auth.filter.exclude-urls=/,/auth/login,/auth/logout,/registry/machine
auth.filter.exclude-url-suffixes=htm,html,js,css,map,ico,ttf,woff,png
auth.username=sentinel
auth.password=sentinel
#redis rule persistence settings (rules are stored in Redis and pushed to clients via pub/sub)
sentinel.rule.redis.enabled=false
sentinel.rule.redis.host=localhost
sentinel.rule.redis.port=6379
sentinel.rule.redis.password=
sentinel.rule.redis.database=0
sentinel.rule.redis.timeout=3000
sentinel.rule.redis.key-prefix=sentinel:rule:
sentinel.rule.redis.channel-prefix=sentinel:channel:
